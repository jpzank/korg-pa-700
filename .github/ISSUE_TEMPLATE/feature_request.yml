name: Feature request
description: Propose an improvement with its safety and evidence implications
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or user need is not currently served?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful outcome, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and evidence impact
      description: Could this send MIDI, read files, capture audio or change Draft/Verified state?
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Relevant hardware
      placeholder: None, PA700, or another model and firmware
  - type: checkboxes
    id: rights
    attributes:
      label: Content
      options:
        - label: This proposal does not require bundling copyrighted songs, manuals, firmware or commercial resources.
          required: true
